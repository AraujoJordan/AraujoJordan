name: Refresh profile stats

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python generate_dashboard.py
      - run: python generate_contributions.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json contributions.json assets/light_mode.svg assets/dark_mode.svg assets/contributions-light.svg assets/contributions-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile stats'
            git push
          fi
